
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080808">
    <meta name="description" content="All official social links of Saif Elruby.">

    <title>Saif Elruby | Official Links</title>

    <style>
        :root {
            --gold: #d4af37;
            --light-gold: #f5df91;
            --black: #080808;
            --card: #111111;
            --muted: #a6a6a6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 35px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background:
                radial-gradient(
                    ellipse at top,
                    #29200b 0%,
                    #11100c 35%,
                    var(--black) 75%
                );
        }

        .profile {
            width: 100%;
            max-width: 430px;
            padding: 35px 25px 25px;
            text-align: center;
            background: rgba(15, 15, 15, 0.94);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 22px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.08);
        }

        .avatar {
            width: 108px;
            height: 108px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold);
            border-radius: 50%;
            color: var(--light-gold);
            background: linear-gradient(145deg, #29200b, #080808);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.18);
            font-family: Georgia, serif;
            font-size: 35px;
            letter-spacing: 2px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(25px, 7vw, 32px);
            font-weight: normal;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
        }

        .bio {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin: 12px 0 25px;
        }

        .divider {
            width: 55px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .social-link {
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 10px;
            background: linear-gradient(110deg, #17140c, #0d0d0d);
            color: var(--light-gold);
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s,
                        border-color 0.2s;
        }

        .social-link:hover {
            transform: translateY(-3px);
            background: #28200d;
            border-color: var(--light-gold);
        }

        .social-link:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .social-icon {
            width: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .phone-link {
            color: #fff;
            background: linear-gradient(110deg, #8c6b16, #5e4710);
        }

        .phone-link:hover {
            background: linear-gradient(110deg, #a9821c, #735711);
        }

        .footer {
            margin-top: 27px;
            color: #777;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .footer span {
            color: var(--gold);
        }

        @media (max-width: 360px) {
            .profile {
                padding: 28px 16px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="profile">

        <div class="avatar" aria-label="Saif Elruby initials">
            SR
        </div>

        <p class="eyebrow">Official Social Links</p>

        <h1>Saif_elruby</h1>

        <p class="bio">
            Welcome to my world.<br>
            Connect with me across my social platforms.
        </p>

        <div class="divider"></div>

        <nav class="links" aria-label="Social media links">

            <a class="social-link"
               href="https://www.facebook.com/share/1HxMdgrvws/?mibextid=wwXIfr"
               target="_blank"
               rel="noopener noreferrer">
                <span class="social-icon" aria-hidden="true">f</span>
                <span>Facebook</span>
            </a>

            <a class="social-link"
               href="https://www.instagram.com/saif_el_ruby?dlrf=MWpoMXR4bG42NDVicw%3D%3D&utm_source=qr"
               target="_blank"
               rel="noopener noreferrer">
                <span class="social-icon" aria-hidden="true">◎</span>
                <span>Instagram</span>
            </a>

            <a class="social-link"
               href="https://www.tiktok.com/@saif_el_ruby?_r=1&_t=ZS-9AiOak9G56z"
               target="_blank"
               rel="noopener noreferrer">
                <span class="social-icon" aria-hidden="true">♪</span>

            <a class="social-link"

                <span>WhatsApp</span>

            <a class="social-link phone-link" id="phoneLink" href="#">
                <span class="social-icon" aria-hidden="true">☎</span>
                <span>Call Me</span>
            </a>

        </nav>

        <footer class="footer">
            © <span id="year"></span> SAIF ELRUBY
            <br><br>
            SIMPLE. ELEGANT. PERSONAL.
        </footer>

    </main>

    <script>
        // Phone number in international format: Egypt (+20)
        const phoneNumber = "201149525433";

        document.getElementById("whatsappLink").href =
            "https://wa.me/" + phoneNumber;

        document.getElementById("phoneLink").href =
            "tel:+" + phoneNumber;

        // Automatically update the copyright year
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
